<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Budget</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Mes Comptes</h1>
        <div id="accounts-list"></div>
        <button class="btn" onclick="openModal()">Ajouter un compte</button>
        <button class="btn" onclick="goToBeneficiaries()">Gérer les bénéficiaires</button>
    </div>

    <div id="modal" class="modal">
        <h2>Ajouter un compte</h2>
        <input type="text" id="account-name" placeholder="Nom du compte">
        <button class="btn" onclick="addAccount()">Ajouter</button>
        <button class="btn" onclick="closeModal()">Annuler</button>
    </div>

    <div id="delete-modal" class="modal">
        <h2>Confirmer la suppression</h2>
        <p>Voulez-vous vraiment supprimer ce compte ?</p>
        <button class="btn" id="confirm-delete">Oui</button>
        <button class="btn" onclick="closeDeleteModal()">Non</button>
    </div>

    <script>
        function goToBeneficiaries() {
            window.location.href = "beneficiaries.html";
        }
    </script>
    <script src="index.js"></script>
</body>
</html>
